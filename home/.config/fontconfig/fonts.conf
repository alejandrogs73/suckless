<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- Iconos: si un carácter no está en Fira Code, buscarlo primero en
	     Symbols Nerd Font. -->
	<alias>
		<family>Fira Code</family>
		<prefer>
			<family>Fira Code</family>
			<family>Symbols Nerd Font Mono</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Fira Code</family>
			<family>Symbols Nerd Font Mono</family>
		</prefer>
	</alias>

	<!-- Linux Libertine G y Biolinum G (de LibreOffice) usan la zona de uso
	     privado para ligaduras propias, y fontconfig las elegía para los
	     iconos de Nerd Font: los separadores redondeados de yazi salían como
	     una "i" y una "T". Se les quita esa zona para que no la reclamen. -->
	<match target="scan">
		<test name="family" compare="contains">
			<string>Linux Libertine G</string>
		</test>
		<edit name="charset" mode="assign">
			<minus>
				<name>charset</name>
				<charset><range><int>0xe000</int><int>0xf8ff</int></range></charset>
			</minus>
		</edit>
	</match>
	<match target="scan">
		<test name="family" compare="contains">
			<string>Linux Biolinum G</string>
		</test>
		<edit name="charset" mode="assign">
			<minus>
				<name>charset</name>
				<charset><range><int>0xe000</int><int>0xf8ff</int></range></charset>
			</minus>
		</edit>
	</match>
</fontconfig>
