# ==========================================
# Configuración Minimalista de Picom (Everforest)
# ==========================================

# --- Backend y Rendimiento ---
backend = "glx";
vsync = true;

# --- Sombras (Shadows) ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
# No dibujar sombra en ventanas flotantes extrañas
shadow-exclude = [
    "class_g = 'dmenu'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Desvanecimiento (Fading) ---
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Transparencias (Opacity) ---
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Hacer que SOLO la terminal (st) sea un 90% transparente
opacity-rule = [
    "90:class_g = 'st-256color' && focused",
    "85:class_g = 'st-256color' && !focused"
];

# --- Esquinas redondeadas (Opcional, si tu build de picom lo soporta) ---
corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'dwm'",
    "class_g = 'dmenu'"
];
