# doas en vez de sudo. Los de wheel pueden hacer de root con su contraseña,
# que se recuerda unos minutos. Suspender, apagar y reiniciar (sin
# argumentos) no la piden: los usan bateria y apagado (home/.local/bin).
# Vale la última regla que coincide.
permit persist :wheel
permit nopass :wheel as root cmd zzz args
permit nopass :wheel as root cmd poweroff args
permit nopass :wheel as root cmd reboot args
