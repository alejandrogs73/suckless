# turnstile en vez de elogind, solo para crear /run/user/UID
# (XDG_RUNTIME_DIR) al entrar. Sin gestor de servicios de usuario: lo de la
# sesión lo arranca .xinitrc. Tampoco exporta DBUS_SESSION_BUS_ADDRESS,
# porque el bus lo abre .xinitrc con dbus-run-session.
backend = none
manage_rundir = yes
export_dbus_address = no
